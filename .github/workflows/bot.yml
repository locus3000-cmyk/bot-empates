name: Bot Empates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  correr-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerias
        run: pip install requests openpyxl

      - name: Correr el bot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot.py

      - name: Guardar el registro
        run: |
          git config user.name "bot"
          git config user.email "bot@github"
          git add registro_empates.xlsx
          git commit -m "Actualizar registro" || echo "Sin cambios"
          git push || echo "Nada que subir"
